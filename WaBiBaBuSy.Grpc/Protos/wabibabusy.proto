syntax = "proto3";

package wabibabusy.v1;

option csharp_namespace = "WaBiBaBuSy.Grpc";

// Server ↔ Client communication service
service WallpaperSync {
  // Client registration
  rpc RegisterClient(ClientInfo) returns (RegistrationResponse);

  // Heartbeat
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // Wallpaper control commands (bidirectional streaming)
  // Client sends responses/status, server sends commands
  rpc SyncStream(stream SyncResponse) returns (stream SyncCommand);

  // Content transfer (chunked file streaming)
  rpc TransferContent(stream ContentChunk) returns (TransferStatus);

  // Network topology
  rpc GetTopology(TopologyRequest) returns (TopologyResponse);
  rpc UpdateClientOrder(ClientOrderUpdate) returns (OrderUpdateResponse);
  rpc UpdateClientDistance(ClientDistanceUpdate) returns (DistanceUpdateResponse);

  // Update distribution
  rpc CheckForUpdates(UpdateCheckRequest) returns (UpdateCheckResponse);
  rpc DownloadUpdate(UpdateDownloadRequest) returns (stream UpdateChunk);
  rpc ReportUpdateStatus(UpdateStatusReport) returns (UpdateStatusResponse);

  // ========================================================================
  // Distributed Animation Composition (Issue #3)
  // ========================================================================
  // Phase 3: Warm-up & Completion-Triggered Handoff

  // Server sends animation preparation (initialize but don't display)
  rpc PrepareAnimation(AnimationPrepare) returns (AnimationAck);

  // Client confirms animation renderer is ready
  rpc ReportAnimationReady(AnimationReady) returns (AnimationAck);

  // Server sends animation start signal (display begins)
  rpc SendAnimationStart(AnimationMetadata) returns (AnimationAck);

  // Client reports animation completion with actual timings
  rpc ReportAnimationComplete(AnimationCompleteReport) returns (AnimationAck);

  // Server stops current animation on client
  rpc StopAnimation(AnimationStopRequest) returns (AnimationAck);

  // Get current status of animation on client
  rpc GetAnimationStatus(AnimationStatusRequest) returns (AnimationStatusResponse);

  // Live thumbnail preview (client pushes thumbnail to server periodically)
  rpc SendThumbnail(ThumbnailData) returns (ThumbnailResponse);

  // Content download (server streams content to client on demand)
  rpc DownloadContent(ContentDownloadRequest) returns (stream ContentChunk);

  // Client sends logs to server (triggered by FETCH_LOGS command)
  rpc SendClientLogs(ClientLogData) returns (LogReceiveResponse);
}

// Client information message
message ClientInfo {
  string client_id = 1;
  string hostname = 2;
  string ip_address = 3;
  ScreenConfiguration screen_config = 4;
  int64 registration_timestamp = 5;
  string app_version = 6;           // e.g., "2.1.0"
  int32 build_number = 7;           // Incremental build number
  string framework_version = 8;     // e.g., "net8.0"
}

// Screen configuration
message ScreenConfiguration {
  int32 monitor_count = 1;
  int32 total_width = 2;
  int32 total_height = 3;
  repeated MonitorInfo monitors = 4;
}

// Monitor information
message MonitorInfo {
  int32 index = 1;
  int32 width = 2;
  int32 height = 3;
  int32 x = 4;
  int32 y = 5;
  bool is_primary = 6;
  string device_name = 7;
  int32 refresh_rate = 8; // Current refresh rate in Hz; 0 if unknown.
  float pixels_per_cm = 9; // Physical pixels per cm (from GetDpiForMonitor); 0 if unknown. Used for bezel/distance gap math.
}

// Registration response
message RegistrationResponse {
  bool success = 1;
  string message = 2;
  string assigned_client_id = 3;
  int32 order_position = 4;
  bool update_available = 5;
  string required_version = 6;      // Server's current version
  int32 required_build_number = 7;
  int64 update_package_size = 8;    // Bytes
  string update_description = 9;    // Release notes/changes
}

// Heartbeat request
message HeartbeatRequest {
  string client_id = 1;
  int64 timestamp = 2;
  ClientStatusEnum status = 3;
  // Drift telemetry (client's NTP-style estimate from prior heartbeat round-trips).
  // has_drift_report=false on the first heartbeat: the estimator has no sample yet,
  // so the server must not read the (default-0) values as "perfectly synced".
  double clock_offset_ms = 4;   // estimated (server_clock - client_clock)
  double rtt_ms = 5;            // round-trip time of the best sample
  bool has_drift_report = 6;
}

// Heartbeat response
message HeartbeatResponse {
  bool acknowledged = 1;
  int64 server_timestamp = 2;
}

// Synchronization command
message SyncCommand {
  CommandType type = 1;
  int64 timestamp_utc = 2;
  int32 sequence_number = 3;
  string content_id = 4;
  SyncParameters params = 5;
}

// Command types
enum CommandType {
  reserved 6, 7;  // were CROSSSCREEN_START / CROSSSCREEN_STOP (legacy frame streaming, removed 2026-07)
  reserved "CROSSSCREEN_START", "CROSSSCREEN_STOP";
  LOAD = 0;
  PLAY = 1;
  PAUSE = 2;
  SEEK = 3;
  STOP = 4;
  SYNC_FRAME = 5;
  FETCH_LOGS = 8;         // Request client to upload its log file
}

// Sync parameters
message SyncParameters {
  int64 target_position_ms = 1;
  int32 playback_speed = 2;
  bool loop = 3;
  string transition_effect = 4;
  int32 animation_speed_cm_per_sec = 5; // Speed of animation travel (cm/s)
  int64 calculated_delay_ms = 6; // Calculated delay based on distance and speed
  string renderer_type = 7;       // "d2d", "libvlc", or "d2d_crossscreen"
  string background_color = 8;    // Hex color for D2D background (e.g., "#000000")
  int32 fit_mode = 9;             // 0=Stretch, 1=Center, 2=Fit, 3=Fill
  // Cross-screen D2D fields (used when renderer_type = "d2d_crossscreen")
  int32 virtual_canvas_width = 10;      // Total virtual canvas width across all nodes
  int32 monitor_offset_x = 11;          // This node's X offset within the virtual canvas
  int64 shared_start_timestamp_ms = 12; // Shared playback start timestamp (UTC ms)
  int32 pixels_per_second = 13;         // Animation movement speed
  bool per_monitor_mode = 14;           // false=spanning/sequential, true=simultaneous
  int32 movement_type = 15;             // 0=Static,1=Linear,2=Bounce,3=SineWave,4=Circular,5=RandomWalk
  string pattern_json = 16;            // JSON-serialized PatternConfig (empty = no pattern)
  string color_grading_json = 17;      // JSON-serialized ColorGradingConfig (empty = default/None)
  string movement_json = 18;           // JSON-serialized MovementConfig (empty = derive from movement_type + pixels_per_second)
  string animation_json = 19;          // JSON-serialized AnimationLayerConfig (AnimationPath is overridden client-side with the cached file)
  string background_json = 20;         // JSON-serialized BackgroundLayerConfig (empty = solid background_color)
  int32 target_monitor_index = 21;     // Which monitor of the remote client renders this (default 0 = primary)
}

// Sync response (client acknowledgment)
message SyncResponse {
  string client_id = 1;
  int32 sequence_number = 2;
  bool acknowledged = 3;
  string error_message = 4;
  int64 current_position_ms = 5;
  WallpaperStateEnum state = 6;
}

// Content chunk for file transfer
message ContentChunk {
  string content_id = 1;
  string filename = 2;
  int64 total_size = 3;
  int32 chunk_index = 4;
  int32 total_chunks = 5;
  bytes data = 6;
  string hash = 7; // SHA-256 hash of complete file
}

// Transfer status response
message TransferStatus {
  bool success = 1;
  string message = 2;
  int32 chunks_received = 3;
  int32 total_chunks = 4;
}

// Topology request
message TopologyRequest {
  // Empty for now, can add filters later
}

// Topology response
message TopologyResponse {
  repeated ConnectedClient clients = 1;
}

// Connected client information
message ConnectedClient {
  string client_id = 1;
  string hostname = 2;
  string ip_address = 3;
  int32 order_position = 4;
  ClientStatusEnum status = 5;
  int64 last_heartbeat = 6;
  ScreenConfiguration screen_config = 7;
  int32 physical_distance_cm = 8; // Distance to previous client in chain (cm)
  // Drift telemetry, last reported via heartbeat. last_drift_report_utc == 0
  // means no report ever (pre-telemetry client or first heartbeat pending).
  double clock_offset_ms = 9;       // (server_clock - client_clock), ms
  double rtt_ms = 10;               // heartbeat round-trip time, ms
  int64 last_drift_report_utc = 11; // server receive time of last report (UTC ms)
}

// Client order update
message ClientOrderUpdate {
  repeated ClientOrderItem client_orders = 1;
}

// Client order item
message ClientOrderItem {
  string client_id = 1;
  int32 new_position = 2;
  int32 physical_distance_cm = 3; // Distance to previous client (cm)
}

// Order update response
message OrderUpdateResponse {
  bool success = 1;
  string message = 2;
}

// Client distance update request
message ClientDistanceUpdate {
  string client_id = 1;
  int32 physical_distance_cm = 2;
}

// Distance update response
message DistanceUpdateResponse {
  bool success = 1;
  string message = 2;
}

// Client status enum
enum ClientStatusEnum {
  CLIENT_DISCONNECTED = 0;
  CLIENT_CONNECTED = 1;
  CLIENT_SYNCING = 2;
  CLIENT_PLAYING = 3;
  CLIENT_ERROR = 4;
}

// Wallpaper state enum
enum WallpaperStateEnum {
  WALLPAPER_UNINITIALIZED = 0;
  WALLPAPER_STOPPED = 1;
  WALLPAPER_PLAYING = 2;
  WALLPAPER_PAUSED = 3;
  WALLPAPER_BUFFERING = 4;
  WALLPAPER_ERROR = 5;
}

// ============================================================================
// Distributed Animation Composition Messages (Issue #3)
// ============================================================================

// Animation preparation message (server → client)
// Tells client to initialize renderer but don't display yet
message AnimationPrepare {
  string animation_id = 1;              // Unique animation ID (UUID)
  string content_path = 2;              // Server-side path to animation file
  int32 target_height_px = 3;           // Target height for animation (e.g., 720)
  int32 animation_speed_px_sec = 4;     // Horizontal speed (pixels per second)
  int64 duration_ms = 5;                // Animation duration in milliseconds
  BackgroundLayerConfig background = 6; // Background layer configuration
  bool loop = 7;                        // Whether to loop animation
  int32 target_monitor_index = 8;       // Physical monitor index
}

// Animation ready message (client → server)
// Client confirms renderer is initialized and ready to display
message AnimationReady {
  string animation_id = 1;              // Which animation is ready
  string client_id = 2;                 // Which client
  int64 ready_timestamp_utc = 3;        // When client became ready (UTC ms)
}

// Animation metadata sent from server to client for distributed rendering
message AnimationMetadata {
  string animation_id = 1;              // Unique animation ID (UUID or file hash)
  string content_path = 2;              // Server-side path to animation file
  int32 target_height_px = 3;           // Target height for animation (e.g., 720)
  int32 animation_speed_px_sec = 4;     // Horizontal speed (pixels per second)
  int64 duration_ms = 5;                // Animation duration in milliseconds
  int64 start_timestamp_utc = 6;        // UTC timestamp when client should start DISPLAYING
  BackgroundLayerConfig background = 7; // Background layer configuration
  bool loop = 8;                        // Whether to loop animation
  int32 target_monitor_index = 9;       // Physical monitor index
}

// Background layer configuration
message BackgroundLayerConfig {
  enum BackgroundMode {
    SOLID_COLOR = 0;  // Solid color background
    STRETCHED_IMAGE = 1;  // Image stretched to fit screen
    TILED_IMAGE = 2;  // Image tiled
  }
  BackgroundMode mode = 1;
  string color_hex = 2;                 // Hex color for solid mode (e.g., "#000000")
  string image_path = 3;                // Path to image for image modes
}

// Animation completion report (client → server)
// Includes actual timing measurements for precise handoff
message AnimationCompleteReport {
  string client_id = 1;
  string animation_id = 2;
  int64 started_timestamp_utc = 3;      // When client ACTUALLY started displaying (UTC ms)
  int64 completed_timestamp_utc = 4;    // When animation completed (UTC ms)
  int64 actual_duration_ms = 5;         // Actual elapsed time from start to complete
  bool successful = 6;
  string error_message = 7;             // If not successful
}

// Stop animation request (server → client)
message AnimationStopRequest {
  string animation_id = 1;
}

// Get animation status request
message AnimationStatusRequest {
  string animation_id = 1;
}

// Get animation status response
message AnimationStatusResponse {
  string animation_id = 1;
  enum AnimationStatus {
    IDLE = 0;
    WAITING = 1;       // Waiting for start time
    RENDERING = 2;     // Currently playing
    PAUSED = 3;
    COMPLETED = 4;
    FAILED = 5;
  }
  AnimationStatus status = 2;
  int32 current_position_ms = 3;        // Current position in animation
  string error_message = 4;             // If status is FAILED
}

// Generic acknowledgment for animation operations
message AnimationAck {
  bool success = 1;
  string message = 2;
}

// Empty message for void responses
message Empty {}

// ============================================================================
// Update Distribution Messages
// ============================================================================

// Update check request
message UpdateCheckRequest {
  string client_id = 1;
  string current_version = 2;
  int32 current_build = 3;
}

// Update check response
message UpdateCheckResponse {
  bool update_available = 1;
  string new_version = 2;
  int32 new_build = 3;
  int64 package_size = 4;
  string package_hash = 5;           // SHA-256 of complete update package
  string release_notes = 6;
  bool is_mandatory = 7;             // Blocks connection if not updated
  repeated string package_files = 8; // List of files in update
}

// Update download request
message UpdateDownloadRequest {
  string client_id = 1;
  string requested_version = 2;
}

// Update chunk (similar to ContentChunk)
message UpdateChunk {
  string update_id = 1;              // Version identifier
  string filename = 2;               // Relative path in update package
  int64 total_size = 3;
  int32 chunk_index = 4;
  int32 total_chunks = 5;
  bytes data = 6;
  string file_hash = 7;              // SHA-256 of individual file
  string package_hash = 8;           // SHA-256 of complete package
}

// Update status report
message UpdateStatusReport {
  string client_id = 1;
  string update_id = 2;
  UpdateStatus status = 3;
  int32 progress_percent = 4;
  string error_message = 5;
}

// Update status enum
enum UpdateStatus {
  UPDATE_CHECKING = 0;
  UPDATE_DOWNLOADING = 1;
  UPDATE_DOWNLOADED = 2;
  UPDATE_VERIFYING = 3;
  UPDATE_APPLYING = 4;
  UPDATE_APPLIED = 5;
  UPDATE_FAILED = 6;
  UPDATE_CANCELLED = 7;
}

// Update status response
message UpdateStatusResponse {
  bool acknowledged = 1;
}

// ============================================================================
// Live Thumbnail Preview Messages
// ============================================================================

// Thumbnail data sent from client to server
message ThumbnailData {
  string client_id = 1;
  bytes thumbnail_jpeg = 2;        // JPEG-encoded thumbnail image
  int32 width = 3;                 // Thumbnail width in pixels
  int32 height = 4;                // Thumbnail height in pixels
  string wallpaper_name = 5;       // Currently displayed wallpaper name
}

// Thumbnail response from server
message ThumbnailResponse {
  bool acknowledged = 1;
}

// ============================================================================
// Content Download Messages (Server → Client)
// ============================================================================

// Request to download content from server
message ContentDownloadRequest {
  string content_id = 1;           // Content identifier
}

// ============================================================================
// Remote Log Fetch Messages
// ============================================================================

// Client log data sent to server
message ClientLogData {
  string client_id = 1;
  string log_content = 2;          // Log file text content (last N lines)
  int64 timestamp = 3;             // When logs were captured
  string log_date = 4;             // Which log file date (yyyy-MM-dd)
}

// Server response to log upload
message LogReceiveResponse {
  bool success = 1;
  string message = 2;
}
